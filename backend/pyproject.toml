[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catchup"
version = "0.1.0"
description = "Self-hosted personal digest"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.14,<2",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "feedparser>=6,<7",
  "trafilatura>=2,<3",
  "openai>=2,<3",
  "cryptography>=44,<48",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catchup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
