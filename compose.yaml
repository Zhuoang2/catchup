services:
  catchup:
    image: ghcr.io/zhuoang2/catchup:latest
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - catchup-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      CATCHUP_DATA_DIR: /data
      CATCHUP_FRONTEND_DIST: /app/frontend
    restart: unless-stopped

volumes:
  catchup-data:
