<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatchUp isn't running</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f0e6; --fg: #151412; --muted: #4a4741; --accent: #8a1c14; --surface: #f8f5ed; --border: #d4cdbd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #ece7dc; --muted: #b8b2a5; --accent: #e0796d; --surface: #1c1b18; --border: #33302a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 32rem); padding: clamp(1.5rem, 6vw, 3rem); background: var(--surface); border: 1px solid var(--border); }
    .logo { display: block; width: 3.5rem; height: 3.5rem; background: var(--fg); position: relative; }
    .logo::before, .logo::after { content: ""; position: absolute; left: 23%; right: 23%; height: 5.5%; background: var(--bg); }
    .logo::before { top: 38%; } .logo::after { top: 57%; }
    .brand { font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.08; letter-spacing: -.04em; }
    p { line-height: 1.55; } .hint { color: var(--muted); font-size: .9rem; }
    pre { overflow-x: auto; background: var(--bg); border: 1px solid var(--border); padding: .8rem 1rem; }
    button { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); padding: .75rem 1.5rem; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <span class="logo" aria-hidden="true"></span><p class="brand">CatchUp</p>
    <h1>CatchUp isn't running</h1><p>Start it, then reload this window.</p>
    <pre><code>docker compose up -d</code></pre>
    <p class="hint">Or, from a source checkout: <code>uv run catchup serve</code></p>
    <button type="button" id="reload">Reload</button>
  </main>
  <script>document.getElementById('reload').addEventListener('click', () => location.reload())</script>
</body>
</html>
