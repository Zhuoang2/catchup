<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatchUp isn't running</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20fill%3D%22%23f4f0e6%22%2F%3E%3Crect%20x%3D%22164%22%20y%3D%22164%22%20width%3D%22696%22%20height%3D%22696%22%20fill%3D%22%23151412%22%2F%3E%3Cpath%20d%3D%22M324%20430h376M324%20562h376%22%20stroke%3D%22%23f4f0e6%22%20stroke-width%3D%2238%22%2F%3E%3C%2Fsvg%3E">
  <style>
    :root { color-scheme: light dark; --bg: #f4f0e6; --fg: #151412; --muted: #4a4741; --accent: #8a1c14; --surface: #f8f5ed; --border: #d4cdbd;
      --body: "Iowan Old Style", "Hoefler Text", Georgia, "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", serif;
      --heading: "Big Caslon", "Baskerville", "Hoefler Text", Georgia, "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #ece7dc; --muted: #b8b2a5; --accent: #e0796d; --surface: #1c1b18; --border: #33302a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--body); display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 28rem); padding: 2.5rem 2rem; background: var(--surface); border: 1px solid var(--border);
      display: grid; justify-items: center; text-align: center; gap: 1rem; }
    .brand { font: 2rem var(--heading); }
    h1 { font: 600 2rem/1.2 var(--heading); letter-spacing: -.01em; }
    p { margin: 0; line-height: 1.55; } .lede, .hint { color: var(--muted); } .hint { font-size: .9rem; }
    pre { max-width: 100%; overflow-x: auto; background: var(--bg); padding: .7rem .9rem; text-align: left; font: .9em ui-monospace, Menlo, monospace; }
    button { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); padding: .55rem 1rem;
      font: 600 .94em var(--body); font-variant-caps: all-small-caps; letter-spacing: .12em; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">CatchUp</p>
    <h1>CatchUp isn't running</h1><p class="lede">Start it, then reload this window.</p>
    <pre><code>docker compose up -d</code></pre>
    <p class="hint">Or, from a source checkout: <code>uv run catchup serve</code></p>
    <button type="button" id="reload">Reload</button>
  </main>
  <script>document.getElementById('reload').addEventListener('click', () => location.reload())</script>
</body>
</html>
